name: tests

on:
  push:
    branches: [develop, main, "integration/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c requirements.constraints.txt
      - name: Validate pricing reference fixtures
        run: python scripts/validate_pricing_fixtures.py
      - name: Check synthetic forecast data matches its seed
        run: python scripts/seed_demo_data.py --check
      - name: Run tests
        run: python -m pytest

  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the declared package manager
        run: npm install --global pnpm@11.18.0 --ignore-scripts
      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Contracts and viewer regression tests
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/packages/viewer/scripts/egress-guard.mjs'
        run: |
          pnpm --filter @dealdesk/contracts build
          pnpm --filter @dealdesk/viewer test
      - name: Build the viewer with external network blocked
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--import=${{ github.workspace }}/packages/viewer/scripts/egress-guard.mjs'
        run: pnpm --filter @dealdesk/viewer build
